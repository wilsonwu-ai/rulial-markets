; rulial-markets test configuration (added by the integrator).
;
; Why this file exists:
;   1. `pythonpath = backend` lets `pytest backend/tests` work from the repo
;      root on a fresh clone, with no PYTHONPATH export and no `cd backend`.
;      The individual test files also self-bootstrap via sys.path, so both
;      invocation styles work; this makes the documented one the easy one.
;   2. `markers` registers @pytest.mark.network, which LANE-NEWS used but could
;      not register because it did not own a config file. Unregistered marks
;      emit PytestUnknownMarkWarning and are an error under -W error.
;   3. The default addopts deselect the one live-network test so an offline
;      clone (or a venue with no wifi) gets a clean green suite. Run the
;      network test explicitly with:  pytest backend/tests -m network
[pytest]
pythonpath = backend
testpaths = backend/tests
addopts = -m "not network"
markers =
    network: test performs live network I/O (deselected by default)
filterwarnings =
    ignore::DeprecationWarning
